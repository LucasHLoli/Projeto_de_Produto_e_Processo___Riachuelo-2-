html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.app{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:1fr 360px;gap:14px;height:calc(100% - 4px);min-height:620px}

.main{display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;min-width:0}
h1{font-size:1.35rem;margin:0;font-weight:600}
.sub{color:var(--muted);margin:0;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border-radius:999px}
.tabs button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:360px}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.cap{position:absolute;left:12px;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.cap b{color:var(--accent)}
.led{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;display:grid;gap:12px;align-content:start;min-width:0}
h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:600}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.steps button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:26px 1fr;gap:8px;width:100%;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
ol.steps button:focus-visible{outline:2px solid var(--accent)}
ol.steps button[aria-current=step]{background:var(--on);border-color:var(--accent)}
.num{font:500 13px var(--mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
[aria-current=step] .num{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.st b{display:block;font-weight:600}
.st span{font-size:12.5px;color:var(--muted)}
.legend{display:grid;gap:4px;font-size:13px}
.legend label{display:grid;grid-template-columns:18px 12px 1fr;gap:8px;align-items:center;cursor:pointer}
.legend input{margin:0;accent-color:var(--accent)}
.sw{width:12px;height:12px;border-radius:3px}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.note b{color:var(--fg)}
</style>
