:root{--bg:#eceff3;--panel:#fff;--fg:#151d26;--muted:#5b6978;--line:#d5dce4;--accent:#d97706;--accent-fg:#fff;--stage:#dfe5ec;--on:#fff7e6;

:root[data-theme="dark"]{--bg:#0d1218;--panel:#161e27;--fg:#e4e9ef;--muted:#93a1b1;--line:#28323e;--accent:#f59e0b;--accent-fg:#1a1205;--stage:#111821;--on:#2a2010;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.app{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:1fr 360px;gap:14px;height:calc(100% - 4px);min-height:620px}

.main{display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;min-width:0}
h1{font-size:1.35rem;margin:0;font-weight:600}
.sub{color:var(--muted);margin:0;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border-radius:999px}

.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:360px}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:600}

ol.steps button:focus-visible{outline:2px solid var(--accent)}
ol.steps button[aria-current=step]{background:var(--on);border-color:var(--accent)}
.num{font:500 13px var(--mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
[aria-current=step] .num{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.st b{display:block;font-weight:600}
.st span{font-size:12.5px;color:var(--muted)}
.legend{display:grid;gap:4px;font-size:13px}
.legend label{display:grid;grid-template-columns:18px 12px 1fr;gap:8px;align-items:center;cursor:pointer}
.legend input{margin:0;accent-color:var(--accent)}
.sw{width:12px;height:12px;border-radius:3px}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.note b{color:var(--fg)}
.fone{position:absolute;right:12px;top:12px;width:150px;border-radius:18px;background:#0b0f14;border:3px solid #2a313b;padding:10px 9px 12px;color:#e5e7eb;font-size:11.5px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fone .bar{height:4px;width:38px;border-radius:2px;background:#2a313b;margin:0 auto 8px}
.fone .prod{font-weight:600;font-size:12.5px}.fone .preco{font:600 15px var(--mono);margin:4px 0 8px}
.fone .btn{display:block;text-align:center;border-radius:8px;padding:6px;font-weight:600;background:#2563eb;color:#fff}
.fone .ok{background:#16a34a}

.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:600 13px var(--body);opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.folha{position:absolute;inset:10px;background:#fbfaf7;border-radius:8px;overflow:auto;padding:10px;display:grid;place-items:center}
.folha[hidden],.mesainfo[hidden],.fone[hidden],.cap[hidden]{display:none}
.folha svg{width:100%;height:auto;max-height:100%}
.mesainfo{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;max-width:calc(100% - 24px)}
.mesainfo code{font:500 12px var(--mono)}
.grp{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 2px;font-weight:600}
@media (max-width:640px){.fone{width:118px;font-size:10.5px}}
</style>
